name: Build Signed Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Keystore and Environment
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ ! -f "release.keystore" ]; then
            keytool -genkey -v -keystore release.keystore -storepass android123 -alias releasekey -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IPCamera,O=Android,C=BD"
          fi
          cp release.keystore debug.keystore 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --continue -x lint -x lintVitalRelease
          else
            gradle assembleRelease --continue -x lint -x lintVitalRelease
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IP-Camera-Release-APK
          path: app/build/outputs/apk/release/*.apk
