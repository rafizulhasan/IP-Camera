name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare .env
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      # app/build.gradle.kts expects:
      #   debug   -> debug.keystore, alias androiddebugkey, password "android"
      #   release -> $KEYSTORE_PATH, alias "upload", $STORE_PASSWORD / $KEY_PASSWORD
      - name: Generate keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload.jks" -storepass android123 \
            -alias upload -keypass android123 -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=IPCamera,O=Android,C=BD"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: IP-Camera-APKs
          path: app/build/outputs/apk/**/*.apk
