workflows:
  native-android-apk:
    name: Build Native Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Set gradlew permissions
        script: chmod +x gradlew
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
